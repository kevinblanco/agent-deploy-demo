# The manifests and values live in the Harness File Store, not in Git.
# The agent can push to this repo, but its Pipeline Executor role can only
# use File Store files, not edit them, so it can't change what gets applied
# or reference a secret from a values file. deploy/ in the repo is the
# source copy a person uploads; editing it changes nothing on its own.
service:
  name: cart-pricing
  identifier: cart_pricing
  orgIdentifier: default
  projectIdentifier: default_project
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: cart_pricing_manifests
            type: K8sManifest
            spec:
              store:
                type: Harness
                spec:
                  files:
                    - /cart-pricing/templates
              valuesPaths:
                - /cart-pricing/values.yaml
              skipResourceVersioning: false
      artifacts:
        primary:
          primaryArtifactRef: cart_pricing_image
          sources:
            - identifier: cart_pricing_image
              type: DockerRegistry
              spec:
                connectorRef: dockerhub
                imagePath: kevinblanco/cart-pricing
                # The tag CI just pushed in this same pipeline run.
                tag: <+pipeline.sequenceId>
  gitOpsEnabled: false
