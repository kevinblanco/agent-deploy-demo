# The production namespace of the local k3d cluster, reached through the delegate
# k3d-production-delegate (Helm chart harness-delegate-ng, namespace harness-production).
# That delegate's service account has the "edit" role in namespace production and
# nothing else: it can't touch the other environment or anything
# cluster-wide, and no one outside the cluster, the agent included, holds
# its credentials.
connector:
  name: k3d-production
  identifier: k3d_production
  description: k3d namespace production via its own namespace-scoped delegate
  orgIdentifier: default
  projectIdentifier: default_project
  type: K8sCluster
  spec:
    credential:
      type: InheritFromDelegate
    delegateSelectors:
      - k3d-production-delegate
