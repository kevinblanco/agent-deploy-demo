# The local k3d cluster, reached through the delegate running inside it.
# The delegate holds the cluster credentials. Nothing else, including the
# coding agent, ever sees a kubeconfig.
#
# It selects the classic delegate (Helm chart harness-delegate-ng). New
# accounts are offered Delegate 3.x, which in Nov 2026 rejects classic CD
# tasks ("DOCKER_ARTIFACT_TASK_NG Task type not supported by delegate(s)").
connector:
  name: k3d-cluster
  identifier: k3d_cluster
  description: Local k3d cluster via the in-cluster classic delegate
  orgIdentifier: default
  projectIdentifier: default_project
  type: K8sCluster
  spec:
    credential:
      type: InheritFromDelegate
    delegateSelectors:
      - k3d-delegate-classic
