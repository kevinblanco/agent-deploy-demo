# The local k3d cluster, reached through the delegate running inside it.
# The delegate holds the cluster credentials. Nothing else, including the
# coding agent, ever sees a kubeconfig.
connector:
  name: k3d-cluster
  identifier: k3d_cluster
  description: Local k3d cluster via the in-cluster delegate
  orgIdentifier: default
  projectIdentifier: default_project
  type: K8sCluster
  spec:
    credential:
      type: InheritFromDelegate
    delegateSelectors:
      - k3d-delegate
