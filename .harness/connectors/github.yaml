# Repo connector for the CI clone. Secret "github_pat" holds a fine-grained
# token for this one repository with Contents: read-only. Add Webhooks read
# and write only if you turn on the push trigger.
connector:
  name: github
  identifier: github
  description: Demo repo for the agent-deploy pipeline
  orgIdentifier: default
  projectIdentifier: default_project
  type: Github
  spec:
    url: https://github.com/kevinblanco/agent-deploy-demo
    authentication:
      type: Http
      spec:
        type: UsernameToken
        spec:
          username: kevinblanco
          tokenRef: github_pat
    apiAccess:
      type: Token
      spec:
        tokenRef: github_pat
    executeOnDelegate: false
    type: Repo
