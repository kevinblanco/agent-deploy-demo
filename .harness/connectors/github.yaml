# Account or project connector to the demo repo. Secret "github_pat" holds a
# classic PAT with scopes: repo, user, admin:repo_hook.
connector:
  name: github
  identifier: github
  description: Demo repo for the agent-deploy pipeline
  orgIdentifier: default
  projectIdentifier: default_project
  type: Github
  spec:
    url: https://github.com/YOUR_GITHUB_USERNAME/agent-deploy-demo
    authentication:
      type: Http
      spec:
        type: UsernameToken
        spec:
          username: YOUR_GITHUB_USERNAME
          tokenRef: github_pat
    apiAccess:
      type: Token
      spec:
        tokenRef: github_pat
    executeOnDelegate: false
    type: Repo
